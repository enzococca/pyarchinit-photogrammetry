[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "pyarchinit-photogrammetry-core"
version = "0.1.0"
description = "Native kernels (Rust) of pyarchinit-photogrammetry: depth maps, orthomosaic, confidence"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry"

[tool.maturin]
module-name = "ppg_core"
features = ["pyo3/extension-module"]
