[build-system]
requires = ["maturin>=1.9.4,<2"]  # 1.9.4: license expressions and license files (PEP 639)
build-backend = "maturin"

[project]
name = "pyarchinit-photogrammetry-core"
version = "0.6.0"
description = "Native kernels (Rust) of pyarchinit-photogrammetry: depth maps (PatchMatch MVS), orthomosaic, confidence, GPU, GNSS post-processing (RTKLIB), Hatanaka-compressed RINEX"
readme = "README.md"
license = "GPL-2.0-or-later AND BSD-2-Clause"
license-files = ["NOTICE", "vendor/rtklib/license.txt"]
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry"

[tool.maturin]
module-name = "ppg_core"
features = ["pyo3/extension-module"]
