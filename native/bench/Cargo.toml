[package]
name = "ppg_bench"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "ppg-bench, the binary that runs the kernels of ppg_engine without Python and times them"
repository = "https://github.com/enzococca/pyarchinit-photogrammetry"
publish = false

[[bin]]
name = "ppg-bench"
path = "src/main.rs"

[dependencies]
ppg_engine = { path = "../engine" }
# what the binary prints is JSON
serde_json = "1"

[dev-dependencies]
# the photos the test of `features` writes (the PNG crate of the engine's reader; MIT OR Apache-2.0)
png = "0.18"
