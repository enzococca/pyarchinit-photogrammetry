[package]
name = "ppg_engine"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "The kernels of pyarchinit-photogrammetry without Python"
repository = "https://github.com/enzococca/pyarchinit-photogrammetry"
publish = false

[dependencies]
rayon = "1.10"
wgpu = "24"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
# constrained Delaunay triangulation of the TIN (MIT OR Apache-2.0)
spade = "=2.15.1"
# linear algebra of the bundle adjustment: the dense and the sparse Cholesky factorisation of the
# reduced camera system (MIT); without its random and file features
faer = { version = "0.24", default-features = false, features = ["std", "rayon", "linalg", "sparse-linalg"] }
# the photos read without Python (image.rs): JPEG with the reduced DCT scales, one thread per
# decode (the photos are read in parallel, not the components of one), PNG, TIFF without its fax
# codec (no photo is a fax); MIT OR Apache-2.0
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.18"
tiff = { version = "0.11", default-features = false, features = ["deflate", "lzw", "jpeg"] }
