[workspace]
members = [".", "engine", "bench"]
resolver = "2"

[package]
name = "ppg_core"
version = "0.8.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Native kernels of pyarchinit-photogrammetry"
repository = "https://github.com/enzococca/pyarchinit-photogrammetry"
publish = false

[lib]
name = "ppg_core"
crate-type = ["cdylib"]

[dependencies]
# the kernels, without Python (folder engine)
ppg_engine = { path = "engine" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
numpy = "0.30"
rayon = "1.10"

[build-dependencies]
# RTKLIB (vendor/rtklib, C) for the post-processing of GNSS observations; build.rs needs
# Tool::is_like_clang_cl, which cc has from 1.2.8
cc = "1.2.8"

[profile.release]
lto = "thin"
codegen-units = 1
# Rust strips debug info by default; the stripped library is refused by macOS 26/27
# ("mis-aligned LINKEDIT string pool"), so it is kept
strip = false
