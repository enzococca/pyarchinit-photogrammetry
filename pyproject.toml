[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyarchinit-photogrammetry"
version = "1.3.3"
description = "Open-source photogrammetry engine for archaeology and BIM, integrated with PyArchInit"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
keywords = ["photogrammetry", "archaeology", "structure-from-motion", "orthophoto", "DEM", "PyArchInit", "BIM", "IFC"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pycolmap>=3.11",
    "opencv-contrib-python-headless>=4.8",
    "pillow>=9.1",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "shapely>=2.0",
    "trimesh>=4.0",
    "contourpy>=1.1",
    "ezdxf>=1.1",
    "matplotlib>=3.7",  # drawings (pottery, plugins' sections and logs); came only through pyvista before
    "laspy[lazrs]>=2.4",
    "sqlalchemy>=2.0",
    "typer>=0.9",
    "fpdf2>=2.8",  # the processing report as PDF (io.pdf_report)
    "openpyxl>=3.1",  # the tables as Excel workbooks (io.tables)
    "threadpoolctl>=3.1",  # BLAS on one thread where results must not depend on the threads (engine.ortho)
]

[project.optional-dependencies]
mesh = ["open3d>=0.18,!=0.20.0"]
bim = ["ifcopenshell>=0.8"]
postgis = ["psycopg2-binary>=2.9; sys_platform != 'win32' or platform_machine != 'ARM64'",
           "psycopg>=3.1; sys_platform == 'win32' and platform_machine == 'ARM64'"]  # psycopg 3 over libpq on Windows ARM64
sam = ["torch>=2.3", "sam2>=1.1", "huggingface_hub>=0.20"]  # the weights come from the Hugging Face hub
learned = ["torch>=2.3", "kornia>=0.8"]  # learned key points + LightGlue (engine.learned), run in a worker process
learn = ["scikit-learn>=1.3"]  # trainable point classification (ai.learn)
fast = ["pyarchinit-photogrammetry-core>=0.4.1"]  # native kernels in Rust (native/), optional
scans = ["pye57>=0.4"]  # laser scans in E57 (io.scans; PTX needs nothing)
munsell = ["colour-science>=0.4.4"]  # Munsell notation of the colours (archaeo.munsell)
coreg = ["xdem>=0.2"]  # DEM coregistration with xdem (archaeo.coreg, method="xdem"): never in "all" nor in the app
gui = ["PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.13", "qtawesome>=1.3", "scikit-learn>=1.3",
       "colour-science>=0.4.4"]
all = ["open3d>=0.18,!=0.20.0", "ifcopenshell>=0.8",
       "psycopg2-binary>=2.9; sys_platform != 'win32' or platform_machine != 'ARM64'",
       "psycopg>=3.1; sys_platform == 'win32' and platform_machine == 'ARM64'", "scikit-learn>=1.3", "PySide6>=6.6",
       "pyvista>=0.43", "pyvistaqt>=0.13", "qtawesome>=1.3", "pye57>=0.4", "colour-science>=0.4.4"]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.10", "pyinstaller-hooks-contrib>=2024.8", "pillow>=9.1"]

[project.scripts]
ppg = "pyarchinit_photogrammetry.cli:main"

[project.gui-scripts]
ppg-gui = "ppg_launcher:main"  # splash with progress before the heavy imports

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry"
Issues = "https://github.com/enzococca/pyarchinit-photogrammetry/issues"

[tool.setuptools]
py-modules = ["ppg_launcher"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# files the code reads at run time (tests/test_packaging.py checks that nothing is left out)
pyarchinit_photogrammetry = ["gui/resources/*", "gui/translations/*.json", "pyarchinit/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run the full photogrammetric pipeline"]
