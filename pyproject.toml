[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyarchinit-photogrammetry"
version = "0.4.2"
description = "Open-source photogrammetry engine for archaeology and BIM, integrated with PyArchInit"
readme = "README.md"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Enzo Cocca", email = "enzo.ccc@gmail.com" }]
requires-python = ">=3.10"
keywords = ["photogrammetry", "archaeology", "structure-from-motion", "orthophoto", "DEM", "PyArchInit", "BIM", "IFC"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pycolmap>=3.11",
    "opencv-contrib-python-headless>=4.8",
    "pillow>=9.1",
    "rasterio>=1.3",
    "pyproj>=3.5",
    "shapely>=2.0",
    "trimesh>=4.0",
    "contourpy>=1.1",
    "ezdxf>=1.1",
    "laspy[lazrs]>=2.4",
    "sqlalchemy>=2.0",
    "typer>=0.9",
]

[project.optional-dependencies]
mesh = ["open3d>=0.18,!=0.20.0"]
bim = ["ifcopenshell>=0.8"]
postgis = ["psycopg2-binary>=2.9"]
sam = ["torch>=2.3", "sam2>=1.1"]
learn = ["scikit-learn>=1.3"]  # trainable point classification (ai.learn)
gui = ["PySide6>=6.6", "pyvista>=0.43", "pyvistaqt>=0.13", "qtawesome>=1.3"]
all = ["open3d>=0.18,!=0.20.0", "ifcopenshell>=0.8", "psycopg2-binary>=2.9", "scikit-learn>=1.3", "PySide6>=6.6",
       "pyvista>=0.43", "pyvistaqt>=0.13", "qtawesome>=1.3"]
dev = ["pytest>=7"]
build = ["pyinstaller>=6.10", "pyinstaller-hooks-contrib>=2024.8", "pillow>=9.1"]

[project.scripts]
ppg = "pyarchinit_photogrammetry.cli:main"

[project.gui-scripts]
ppg-gui = "pyarchinit_photogrammetry.gui:main"

[project.urls]
Homepage = "https://github.com/enzococca/pyarchinit-photogrammetry"
Issues = "https://github.com/enzococca/pyarchinit-photogrammetry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# files the code reads at run time (tests/test_packaging.py checks that nothing is left out)
pyarchinit_photogrammetry = ["gui/resources/*", "pyarchinit/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run the full photogrammetric pipeline"]
