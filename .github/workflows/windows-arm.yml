name: windows-arm

# Toward a native Windows ARM64 application (Snapdragon laptops, Windows 11 on a Mac with Apple
# Silicon; the x64 application already runs there under emulation). Several libraries publish no
# win_arm64 wheels and are built here, each in its own job: lazrs (LAZ point clouds), the native
# core of this project, OpenCV (the modules this program uses), pycolmap (COLMAP with vcpkg, as
# COLMAP's own Windows wheels) and Open3D (without its GUI, as this program's Linux ARM wheels). On
# demand; the wheels stay as artifacts.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run"
        default: "lazrs core opencv pycolmap open3d"

jobs:
  lazrs:
    if: contains(inputs.jobs, 'lazrs')
    runs-on: windows-11-arm
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: lazrs from its source (Rust)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip wheel "lazrs==0.8.2" --no-binary lazrs --no-deps -w wheels
          pip install (Get-ChildItem wheels/*.whl).FullName
          python -c "import lazrs; print('lazrs', lazrs.LasZipDecompressor)"
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-lazrs
          path: wheels/*.whl
          if-no-files-found: error

  core:
    if: contains(inputs.jobs, 'core')
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Native core
        shell: pwsh
        run: |
          python -m pip install --upgrade pip maturin numpy
          maturin build --release -m native/Cargo.toml --out wheels
          pip install (Get-ChildItem wheels/*.whl).FullName
          python -c "import numpy as np, ppg_core; print(ppg_core.__version__, ppg_core.combine_depths(np.ones((2, 3, 4), np.float32), 1, 0.01).shape)"
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-core
          path: wheels/*.whl
          if-no-files-found: error

  opencv:
    if: contains(inputs.jobs, 'opencv')
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: OpenCV from its source, the modules this program uses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # short paths: opencv-python sets up ARM64 for the Visual Studio generator only, whose file
          # tracker fails beyond 260 characters (pip's temporary folders are longer)
          New-Item -ItemType Directory -Force C:\t | Out-Null
          $env:TEMP = "C:\t"; $env:TMP = "C:\t"
          $env:ENABLE_CONTRIB = "1"; $env:ENABLE_HEADLESS = "1"
          # OpenCV 5 has all this program uses in its main modules (ArUco, the colour chart detector and
          # the colour correction too): only those are built, under the package name of the dependency.
          # Videos are read by Media Foundation, off in the headless packages: OpenCV has no FFmpeg for ARM64.
          $env:CMAKE_ARGS = "-DBUILD_LIST=core,imgproc,imgcodecs,videoio,calib,stereo,features,flann,geometry,objdetect,photo,python3 -DWITH_MSMF=ON"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = $env:NUMBER_OF_PROCESSORS
          python -m pip install --upgrade pip
          # its build requirements pin numpy 2.0.2, which has no win_arm64 wheel: a numpy 2 that has one
          # (a module built against numpy 2.x works with every 2.x)
          pip install numpy packaging "scikit-build>=0.14.0" "setuptools<70" wheel
          # the source archive straight from PyPI: "pip download --no-binary :all:" builds the build
          # requirements from source too (numpy 2.0.2, cmake) and spent the six hours of the job there
          $release = Invoke-RestMethod "https://pypi.org/pypi/opencv-contrib-python-headless/5.0.0.93/json"
          $sdist = $release.urls | Where-Object { $_.packagetype -eq "sdist" } | Select-Object -First 1
          Invoke-WebRequest $sdist.url -OutFile C:\t\opencv.tar.gz
          tar -xzf C:\t\opencv.tar.gz -C C:\t
          Move-Item (Get-ChildItem C:\t -Directory -Filter "opencv*").FullName C:\cv
          # the package waits for OpenCV's FFmpeg library on every Windows: there is none for ARM64
          Set-Content C:\t\patch.py @'
          import pathlib
          setup = pathlib.Path(r"C:\cv\setup.py")
          text = setup.read_text(encoding="utf-8")
          old = 'if os.name == "nt"\n            else []'
          assert text.count(old) == 1, "setup.py of opencv-python has changed"
          setup.write_text(text.replace(old, 'if os.name == "nt" and platform.machine() != "ARM64"\n            else []'), encoding="utf-8")
          '@
          python C:\t\patch.py
          pip wheel C:\cv --no-deps --no-build-isolation -w wheels
          pip install (Get-ChildItem wheels/*.whl).FullName numpy
          Set-Content C:\t\check.py @'
          import cv2, numpy as np
          image = np.zeros((64, 64, 3), np.uint8)
          cv2.mcc.CCheckerDetector_create(); cv2.ccm.ColorCorrectionModel
          cv2.aruco.ArucoDetector(cv2.aruco.getPredefinedDictionary(cv2.aruco.DICT_4X4_50))
          cv2.StereoSGBM_create(0, 16, 5); cv2.ORB_create().detect(image); cv2.BFMatcher(cv2.NORM_HAMMING)
          cv2.inpaint(image, np.zeros((64, 64), np.uint8), 3, cv2.INPAINT_TELEA)
          ok, data = cv2.imencode(".jpg", image); cv2.imdecode(data, cv2.IMREAD_COLOR)
          backends = [cv2.videoio_registry.getBackendName(b) for b in cv2.videoio_registry.getBackends()]
          print(cv2.__version__, backends)
          if "MSMF" not in backends:
              print("::warning::OpenCV without Media Foundation: videos cannot be read")
          '@
          python C:\t\check.py
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-opencv
          path: wheels/*.whl
          if-no-files-found: error

  pycolmap:
    if: contains(inputs.jobs, 'pycolmap')
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          repository: colmap/colmap
          ref: "4.2.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Packages vcpkg built before
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-windows-colmap-4.2.1-${{ github.run_id }}
          restore-keys: vcpkg-arm64-windows-colmap-4.2.1-
      - name: COLMAP and pycolmap with vcpkg for arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $root = $PWD.Path -replace '\\', '/'
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$root/vcpkg-cache"  # kept between runs (steps before and after)
          # COLMAP's script enters the x64 developer shell of Visual Studio
          (Get-Content scripts/shell/enter_vs_dev_shell.ps1) -replace '-host_arch=amd64 -arch=amd64', '-host_arch=arm64 -arch=arm64' |
            Set-Content scripts/shell/enter_vs_dev_shell.ps1
          & ./scripts/shell/enter_vs_dev_shell.ps1
          git clone https://github.com/microsoft/vcpkg "$root/vcpkg"
          & "$root/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force triplets | Out-Null
          Set-Content triplets/arm64-windows-release.cmake @(
            "set(VCPKG_TARGET_ARCHITECTURE arm64)", "set(VCPKG_CRT_LINKAGE dynamic)",
            "set(VCPKG_LIBRARY_LINKAGE dynamic)", "set(VCPKG_BUILD_TYPE release)")
          $env:VCPKG_OVERLAY_TRIPLETS = "$root/triplets"
          $toolchain = "$root/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$root/install" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=arm64-windows-release `
            -DCUDA_ENABLED=OFF -DONNX_ENABLED=OFF -DGUI_ENABLED=OFF -DCGAL_ENABLED=OFF -DLSD_ENABLED=OFF `
            -DDOWNLOAD_ENABLED=OFF
          # (download support on MSVC ARM64 looks for its CryptoPP target under another name in 4.2.1 and
          # falls back to an OpenSSL that is not there; this program downloads nothing through COLMAP)
          cmake --build build --target install
          python -m pip install --upgrade pip build delvewheel
          python python/ci/install-build-requirements.py
          # CMAKE_PREFIX_PATH given here replaces the one scikit-build-core makes from the Python
          # packages, so pybind11 is named on its own
          $pybind11 = (python -m pybind11 --cmakedir) -replace '\\', '/'
          python -m build --wheel --no-isolation -o raw `
            -C cmake.define.CMAKE_TOOLCHAIN_FILE="$toolchain" `
            -C cmake.define.pybind11_DIR="$pybind11" `
            -C cmake.define.VCPKG_TARGET_TRIPLET=arm64-windows-release `
            -C cmake.define.VCPKG_INSTALLED_DIR="$root/build/vcpkg_installed" `
            -C cmake.define.CMAKE_PREFIX_PATH="$root/install" `
            -C cmake.args=-GNinja .
          delvewheel repair -v --add-path "$root/build/vcpkg_installed/arm64-windows-release/bin" -w wheels `
            (Get-ChildItem raw/*.whl).FullName
          pip install (Get-ChildItem wheels/*.whl).FullName
          python -c "import pycolmap; print(pycolmap.__version__, pycolmap.Reconstruction().summary())"
      - name: Keep the packages vcpkg built
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-windows-colmap-4.2.1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-pycolmap
          path: wheels/*.whl
          if-no-files-found: error

  open3d:
    if: contains(inputs.jobs, 'open3d')
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          repository: isl-org/Open3D
          ref: v0.19.0
          path: open3d
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Packages vcpkg built before
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-windows-open3d-${{ github.run_id }}
          restore-keys: vcpkg-arm64-windows-open3d-
      - name: Open3D 0.19 without the GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $root = $PWD.Path -replace '\\', '/'
          # OpenSSL for curl (Open3D downloads a BoringSSL built for x64 only): vcpkg, as for pycolmap
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$root/vcpkg-cache"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$root/vcpkg"
          & "$root/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$root/vcpkg/vcpkg.exe" install openssl --triplet arm64-windows
          $ssl = "$root/vcpkg/installed/arm64-windows"
          # BLAS and LAPACK: the OpenBLAS the project itself publishes for Windows on ARM (a DLL, with
          # LAPACKE); Open3D would otherwise download Intel's MKL for x64 or build OpenBLAS with gfortran
          Invoke-WebRequest https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.30/OpenBLAS-0.3.30-woa64-dll.zip -OutFile openblas.zip
          Expand-Archive openblas.zip -DestinationPath "$root/ob"
          $blas = "$root/ob/OpenBLAS"
          # its LAPACK headers use C99 _Complex unless the complex types are defined before: cl.exe
          # has no _Complex, so in C++ they are plain structures (std::complex returned by C-linkage
          # functions is a warning Open3D treats as an error)
          $complex = @'
          #if defined(__cplusplus) && !defined(lapack_complex_float)
          typedef struct { float real, imag; } ppg_lapack_complex_float;
          typedef struct { double real, imag; } ppg_lapack_complex_double;
          #define lapack_complex_float ppg_lapack_complex_float
          #define lapack_complex_double ppg_lapack_complex_double
          #define lapack_complex_float_real(z) ((z).real)
          #define lapack_complex_float_imag(z) ((z).imag)
          #define lapack_complex_double_real(z) ((z).real)
          #define lapack_complex_double_imag(z) ((z).imag)
          #endif
          '@
          foreach ($h in "lapack.h", "lapacke.h") {
            $path = "$blas/include/openblas/$h"
            Set-Content $path ($complex + "`n" + (Get-Content $path -Raw))
          }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if (-not $vs) { $vs = & $vswhere -latest -products * -property installationPath }
          # Embree for ARM64 on Windows: NEON as on Linux ARM, built with clang-cl (Embree's headers
          # know the ARM64 of clang, __aarch64__ and __ARM_NEON, not that of cl.exe: with cl.exe it
          # takes the AVX code and a 32-bit ssize_t); told it is no SYCL compiler, or it takes the
          # DPC++ flags (-msse2) because this clang accepts -fsycl
          $clang = (Get-ChildItem "C:/Program Files/LLVM/bin/clang-cl.exe", "$vs/VC/Tools/Llvm/ARM64/bin/clang-cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $clang) { throw "no clang-cl on this runner" }
          & $clang --version
          # reached through a junction without spaces: a path with a space is cut at the space in the
          # list of CMake arguments, and the 8.3 name hides "clang-cl" from CMake, which then takes
          # the compiler for a GNU-style clang
          New-Item -ItemType Junction -Path C:\LLVM -Target (Split-Path (Split-Path $clang)) | Out-Null
          $env:EMBREE_CLANG = "C:/LLVM/bin/clang-cl.exe"
          # the sse2neon of Embree 4.3.3 names a Windows type (DWORD) without its header
          Set-Content embree_arm.py @'
          import pathlib, sys
          f = pathlib.Path(sys.argv[1]) / "common" / "simd" / "arm" / "sse2neon.h"
          text = f.read_text(encoding="utf-8")
          assert text.count("DWORD cnt = 0;") == 2, "sse2neon.h of Embree has changed"
          f.write_text(text.replace("DWORD cnt = 0;", "unsigned long cnt = 0;"), encoding="utf-8")
          '@
          $env:EMBREE_PATCH = "$root/embree_arm.py"
          # the KWIML of VTK 9.1 knows the ARM64 of GCC and clang (__aarch64__), not that of cl.exe:
          # byte order unknown and pointers of 4 bytes
          Set-Content vtk_arm.py @'
          import pathlib, sys
          f = pathlib.Path(sys.argv[1]) / "Utilities" / "KWIML" / "vtkkwiml" / "include" / "kwiml" / "abi.h"
          text = f.read_text(encoding="utf-8")
          assert text.count("#elif defined(__aarch64__)") == 1, "abi.h of KWIML has changed"
          text = text.replace("#elif defined(__aarch64__)", "#elif defined(__aarch64__) || defined(_M_ARM64)")
          assert text.count("# elif defined(_M_X64)") == 1, "abi.h of KWIML has changed (pointer size)"
          text = text.replace("# elif defined(_M_X64)", "# elif defined(_M_X64) || defined(_M_ARM64)")
          f.write_text(text, encoding="utf-8")
          '@
          $env:VTK_PATCH = "$root/vtk_arm.py"
          $env:EMBREE_PYTHON = (Get-Command python).Source -replace '\\', '/'
          Set-Content patch.py @'
          import os, pathlib
          f = pathlib.Path("open3d/3rdparty/embree/embree.cmake")
          text = f.read_text(encoding="utf-8")
          old = "else() # Linux(x86) and WIN32"
          assert text.count(old) == 1, "embree.cmake of Open3D has changed"
          clang = os.environ["EMBREE_CLANG"]
          new = """elseif(WIN32 AND CMAKE_SYSTEM_PROCESSOR MATCHES "ARM64|arm64|aarch64")
              set(ISA_ARGS -DEMBREE_ISA_AVX=OFF
                           -DEMBREE_ISA_AVX2=OFF
                           -DEMBREE_ISA_AVX512=OFF
                           -DEMBREE_ISA_SSE2=OFF
                           -DEMBREE_ISA_SSE42=OFF
                           -DCMAKE_SYSTEM_PROCESSOR=ARM64
                           -DCOMPILER_HAS_SYCL_SUPPORT=OFF
                           -DCMAKE_C_COMPILER=%s
                           -DCMAKE_CXX_COMPILER=%s
              )
              set(ISA_LIBS "")
              set(ISA_BUILD_BYPRODUCTS "")
              set(EMBREE_PATCH_COMMAND "%s" "%s" <SOURCE_DIR>)
          """ % (clang, clang, os.environ["EMBREE_PYTHON"], os.environ["EMBREE_PATCH"]) + old
          text = text.replace(old, new)
          old = '    UPDATE_COMMAND ""\n'
          assert text.count(old) == 1, "the Embree project of Open3D has changed"
          text = text.replace(old, old + "    PATCH_COMMAND ${EMBREE_PATCH_COMMAND}\n")
          f.write_text(text, encoding="utf-8")
          # VTK built from its source gets the KWIML patch
          f = pathlib.Path("open3d/3rdparty/vtk/vtk_build.cmake")
          text = f.read_text(encoding="utf-8")
          # (the first of its two projects is the build from source, the second the download)
          old = "    ExternalProject_Add(\n        ext_vtk\n"
          assert text.count(old) == 2, "vtk_build.cmake of Open3D has changed"
          text = text.replace(old, '    set(VTK_PATCH_COMMAND "%s" "%s" <SOURCE_DIR>)\n' % (os.environ["EMBREE_PYTHON"], os.environ["VTK_PATCH"]) + old, 1)
          old = '        UPDATE_COMMAND ""\n'
          assert text.count(old) == 2, "the VTK projects of Open3D have changed"
          text = text.replace(old, old + "        PATCH_COMMAND ${VTK_PATCH_COMMAND}\n", 1)
          f.write_text(text, encoding="utf-8")
          # this Visual Studio (MSVC 14.5) has no <experimental/filesystem> any more
          for f in [*pathlib.Path("open3d/cpp").rglob("*.cpp"), *pathlib.Path("open3d/cpp").rglob("*.h")]:
              text = f.read_text(encoding="utf-8")
              if "experimental/filesystem" in text:
                  text = text.replace("#include <experimental/filesystem>", "#include <filesystem>")
                  text = text.replace("std::experimental::filesystem", "std::filesystem")
                  f.write_text(text, encoding="utf-8")
          # with a system OpenSSL, Open3D links curl to libcrypto only: libssl is needed too
          f = pathlib.Path("open3d/3rdparty/find_dependencies.cmake")
          text = f.read_text(encoding="utf-8")
          old = "TARGETS OpenSSL::Crypto\n"
          assert text.count(old) == 1, "find_dependencies.cmake of Open3D has changed (OpenSSL)"
          f.write_text(text.replace(old, "TARGETS OpenSSL::SSL OpenSSL::Crypto\n"), encoding="utf-8")
          # with a system OpenSSL there is no BoringSSL target for curl to wait for
          f = pathlib.Path("open3d/3rdparty/curl/curl.cmake")
          text = f.read_text(encoding="utf-8")
          old = "add_dependencies(ext_curl ext_boringssl)"
          assert text.count(old) == 1, "curl.cmake of Open3D has changed"
          f.write_text(text.replace(old, "if(TARGET ext_boringssl)\n    add_dependencies(ext_curl ext_boringssl)\nendif()"), encoding="utf-8")
          '@
          python patch.py
          python -m pip install --upgrade pip
          # cmake 3 (the runner has cmake 4, which refuses the old CMake projects Open3D builds: zlib)
          pip install numpy "setuptools<81" wheel delvewheel ninja "cmake<4"
          $py = (Get-Command python).Source -replace '\\', '/'
          $cmake = (python -c "import cmake, os; print(os.path.join(cmake.CMAKE_BIN_DIR, 'cmake.exe'))")
          $env:CMAKE_POLICY_VERSION_MINIMUM = "3.5"
          # the developer shell of Visual Studio for ARM64 (the Visual Studio generator does not find
          # the installation on these runners), then Ninja
          Import-Module (Join-Path $vs "Common7/Tools/Microsoft.VisualStudio.DevShell.dll")
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments "-arch=arm64 -host_arch=arm64"
          Set-Location $root
          # VTK from its source: the one Open3D downloads for Windows is built for x64. The headers
          # of OpenBLAS (cblas.h, lapacke.h) are not on the include path Open3D makes for a
          # system BLAS; the flags given keep CMake's own for cl.exe (WIN32 for PoissonRecon's headers),
          # name the architecture for the Windows headers included before windows.h (the dirent of
          # Open3D knows x86, x64 and ARM, not ARM64)
          # and tell the KWIML of VTK 9.1 the byte order, which it does not know for ARM64, skipping its
          # checks of the pointer sizes (typedefs it then declared twice);
          # BORINGSSL_ROOT_DIR is what its curl recipe asks for even with a system OpenSSL
          & $cmake -S open3d -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="$root/install" -DDEVELOPER_BUILD=OFF `
            -DBUILD_SHARED_LIBS=OFF -DBUILD_PYTHON_MODULE=ON -DBUILD_GUI=OFF -DBUILD_WEBRTC=OFF `
            -DBUILD_EXAMPLES=OFF -DBUILD_UNIT_TESTS=OFF -DBUILD_BENCHMARKS=OFF -DBUILD_ISPC_MODULE=OFF `
            -DBUILD_CUDA_MODULE=OFF -DBUILD_JUPYTER_EXTENSION=OFF -DBUILD_AZURE_KINECT=OFF `
            -DBUILD_LIBREALSENSE=OFF -DWITH_IPP=OFF -DWITH_OPENMP=ON -DBUILD_VTK_FROM_SOURCE=ON `
            -DUSE_BLAS=ON -DUSE_SYSTEM_BLAS=ON -DBLA_VENDOR=OpenBLAS `
            -DBLAS_LIBRARIES="$blas/lib/openblas.lib" -DLAPACK_LIBRARIES="$blas/lib/openblas.lib" `
            -DLAPACKE_DIR="$blas" -DLAPACKE_INCDIR="$blas/include/openblas" -DLAPACKE_LIBDIR="$blas/lib" `
            -DCMAKE_CXX_FLAGS="/DWIN32 /D_WINDOWS /D_ARM64_ /W3 /GR /EHsc /I$blas/include/openblas /DKWIML_ABI_ENDIAN_ID=KWIML_ABI_ENDIAN_ID_LITTLE /DKWIML_ABI_NO_VERIFY" `
            -DCMAKE_C_FLAGS="/DWIN32 /D_WINDOWS /D_ARM64_ /W3 /I$blas/include/openblas /DKWIML_ABI_ENDIAN_ID=KWIML_ABI_ENDIAN_ID_LITTLE /DKWIML_ABI_NO_VERIFY" `
            -DUSE_SYSTEM_OPENSSL=ON -DOPENSSL_ROOT_DIR="$ssl" -DBORINGSSL_ROOT_DIR="$ssl" `
            -DPython3_EXECUTABLE="$py" -DPYTHON_EXECUTABLE="$py"
          & $cmake --build build --target pip-package
          $raw = Get-ChildItem build/lib/python_package/pip_package/*.whl
          delvewheel repair -v --add-path "$blas/bin;$ssl/bin" -w wheels $raw.FullName
          pip install (Get-ChildItem wheels/*.whl).FullName
          Set-Content check.py @'
          import numpy as np, open3d as o3d
          mesh = o3d.geometry.TriangleMesh.create_sphere(1.0, 20)
          pcd = mesh.sample_points_uniformly(5000); pcd.estimate_normals()
          rec, _ = o3d.geometry.TriangleMesh.create_from_point_cloud_poisson(pcd, depth=6)
          scene = o3d.t.geometry.RaycastingScene(); scene.add_triangles(o3d.t.geometry.TriangleMesh.from_legacy(mesh))
          rays = o3d.core.Tensor([[0, 0, 5, 0, 0, -1]], dtype=o3d.core.Dtype.Float32)
          hit = scene.cast_rays(rays)["t_hit"].numpy()
          tree = o3d.geometry.KDTreeFlann(pcd); k, idx, _ = tree.search_knn_vector_3d(pcd.points[0], 5)
          print(o3d.__version__, "poisson faces", len(rec.triangles), "ray", hit, "knn", k)
          '@
          python check.py
      - name: Keep the packages vcpkg built
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-windows-open3d-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
