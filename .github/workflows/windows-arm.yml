name: windows-arm

# Toward a native Windows ARM64 application (Snapdragon laptops, Windows 11 on a Mac with Apple
# Silicon; the x64 application already runs there under emulation). Several libraries publish no
# win_arm64 wheels and are built here, each in its own job: lazrs (LAZ point clouds), the native
# core of this project, OpenCV (the modules this program uses) and pycolmap (COLMAP with vcpkg, as
# COLMAP's own Windows wheels). On demand; the wheels stay as artifacts.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Jobs to run"
        default: "lazrs core opencv pycolmap"

jobs:
  lazrs:
    if: contains(inputs.jobs, 'lazrs')
    runs-on: windows-11-arm
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: lazrs from its source (Rust)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip wheel "lazrs==0.8.2" --no-binary lazrs --no-deps -w wheels
          pip install (Get-ChildItem wheels/*.whl).FullName
          python -c "import lazrs; print('lazrs', lazrs.LasZipDecompressor)"
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-lazrs
          path: wheels/*.whl
          if-no-files-found: error

  core:
    if: contains(inputs.jobs, 'core')
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Native core
        shell: pwsh
        run: |
          python -m pip install --upgrade pip maturin numpy
          maturin build --release -m native/Cargo.toml --out wheels
          pip install (Get-ChildItem wheels/*.whl).FullName
          python -c "import numpy as np, ppg_core; print(ppg_core.__version__, ppg_core.combine_depths(np.ones((2, 3, 4), np.float32), 1, 0.01).shape)"
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-core
          path: wheels/*.whl
          if-no-files-found: error

  opencv:
    if: contains(inputs.jobs, 'opencv')
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: OpenCV from its source, the modules this program uses
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # short paths: opencv-python sets up ARM64 for the Visual Studio generator only, whose file
          # tracker fails beyond 260 characters (pip's temporary folders are longer)
          New-Item -ItemType Directory -Force C:\t | Out-Null
          $env:TEMP = "C:\t"; $env:TMP = "C:\t"
          $env:ENABLE_CONTRIB = "1"; $env:ENABLE_HEADLESS = "1"
          # OpenCV 5 has all this program uses in its main modules (ArUco, the colour chart detector and
          # the colour correction too): only those are built, under the package name of the dependency.
          # Videos are read by Media Foundation, off in the headless packages: OpenCV has no FFmpeg for ARM64.
          $env:CMAKE_ARGS = "-DBUILD_LIST=core,imgproc,imgcodecs,videoio,calib,stereo,features,flann,geometry,objdetect,photo,python3 -DWITH_MSMF=ON"
          $env:CMAKE_BUILD_PARALLEL_LEVEL = $env:NUMBER_OF_PROCESSORS
          python -m pip install --upgrade pip
          # its build requirements pin numpy 2.0.2, which has no win_arm64 wheel: a numpy 2 that has one
          # (a module built against numpy 2.x works with every 2.x)
          pip install numpy packaging "scikit-build>=0.14.0" "setuptools<70" wheel
          # the source archive straight from PyPI: "pip download --no-binary :all:" builds the build
          # requirements from source too (numpy 2.0.2, cmake) and spent the six hours of the job there
          $release = Invoke-RestMethod "https://pypi.org/pypi/opencv-contrib-python-headless/5.0.0.93/json"
          $sdist = $release.urls | Where-Object { $_.packagetype -eq "sdist" } | Select-Object -First 1
          Invoke-WebRequest $sdist.url -OutFile C:\t\opencv.tar.gz
          tar -xzf C:\t\opencv.tar.gz -C C:\t
          Move-Item (Get-ChildItem C:\t -Directory -Filter "opencv*").FullName C:\cv
          # the package waits for OpenCV's FFmpeg library on every Windows: there is none for ARM64
          Set-Content C:\t\patch.py @'
          import pathlib
          setup = pathlib.Path(r"C:\cv\setup.py")
          text = setup.read_text(encoding="utf-8")
          old = 'if os.name == "nt"\n            else []'
          assert text.count(old) == 1, "setup.py of opencv-python has changed"
          setup.write_text(text.replace(old, 'if os.name == "nt" and platform.machine() != "ARM64"\n            else []'), encoding="utf-8")
          '@
          python C:\t\patch.py
          pip wheel C:\cv --no-deps --no-build-isolation -w wheels
          pip install (Get-ChildItem wheels/*.whl).FullName numpy
          Set-Content C:\t\check.py @'
          import cv2, numpy as np
          image = np.zeros((64, 64, 3), np.uint8)
          cv2.mcc.CCheckerDetector_create(); cv2.ccm.ColorCorrectionModel
          cv2.aruco.ArucoDetector(cv2.aruco.getPredefinedDictionary(cv2.aruco.DICT_4X4_50))
          cv2.StereoSGBM_create(0, 16, 5); cv2.ORB_create().detect(image); cv2.BFMatcher(cv2.NORM_HAMMING)
          cv2.inpaint(image, np.zeros((64, 64), np.uint8), 3, cv2.INPAINT_TELEA)
          ok, data = cv2.imencode(".jpg", image); cv2.imdecode(data, cv2.IMREAD_COLOR)
          backends = [cv2.videoio_registry.getBackendName(b) for b in cv2.videoio_registry.getBackends()]
          print(cv2.__version__, backends)
          if "MSMF" not in backends:
              print("::warning::OpenCV without Media Foundation: videos cannot be read")
          '@
          python C:\t\check.py
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-opencv
          path: wheels/*.whl
          if-no-files-found: error

  pycolmap:
    if: contains(inputs.jobs, 'pycolmap')
    runs-on: windows-11-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          repository: colmap/colmap
          ref: "4.2.1"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Packages vcpkg built before
        uses: actions/cache/restore@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-windows-colmap-4.2.1-${{ github.run_id }}
          restore-keys: vcpkg-arm64-windows-colmap-4.2.1-
      - name: COLMAP and pycolmap with vcpkg for arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $root = $PWD.Path -replace '\\', '/'
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = "$root/vcpkg-cache"  # kept between runs (steps before and after)
          # COLMAP's script enters the x64 developer shell of Visual Studio
          (Get-Content scripts/shell/enter_vs_dev_shell.ps1) -replace '-host_arch=amd64 -arch=amd64', '-host_arch=arm64 -arch=arm64' |
            Set-Content scripts/shell/enter_vs_dev_shell.ps1
          & ./scripts/shell/enter_vs_dev_shell.ps1
          git clone https://github.com/microsoft/vcpkg "$root/vcpkg"
          & "$root/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force triplets | Out-Null
          Set-Content triplets/arm64-windows-release.cmake @(
            "set(VCPKG_TARGET_ARCHITECTURE arm64)", "set(VCPKG_CRT_LINKAGE dynamic)",
            "set(VCPKG_LIBRARY_LINKAGE dynamic)", "set(VCPKG_BUILD_TYPE release)")
          $env:VCPKG_OVERLAY_TRIPLETS = "$root/triplets"
          $toolchain = "$root/vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$root/install" `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" -DVCPKG_TARGET_TRIPLET=arm64-windows-release `
            -DCUDA_ENABLED=OFF -DONNX_ENABLED=OFF -DGUI_ENABLED=OFF -DCGAL_ENABLED=OFF -DLSD_ENABLED=OFF `
            -DDOWNLOAD_ENABLED=OFF
          # (download support on MSVC ARM64 looks for its CryptoPP target under another name in 4.2.1 and
          # falls back to an OpenSSL that is not there; this program downloads nothing through COLMAP)
          cmake --build build --target install
          python -m pip install --upgrade pip build delvewheel
          python python/ci/install-build-requirements.py
          # CMAKE_PREFIX_PATH given here replaces the one scikit-build-core makes from the Python
          # packages, so pybind11 is named on its own
          $pybind11 = (python -m pybind11 --cmakedir) -replace '\\', '/'
          python -m build --wheel --no-isolation -o raw `
            -C cmake.define.CMAKE_TOOLCHAIN_FILE="$toolchain" `
            -C cmake.define.pybind11_DIR="$pybind11" `
            -C cmake.define.VCPKG_TARGET_TRIPLET=arm64-windows-release `
            -C cmake.define.VCPKG_INSTALLED_DIR="$root/build/vcpkg_installed" `
            -C cmake.define.CMAKE_PREFIX_PATH="$root/install" `
            -C cmake.args=-GNinja .
          delvewheel repair -v --add-path "$root/build/vcpkg_installed/arm64-windows-release/bin" -w wheels `
            (Get-ChildItem raw/*.whl).FullName
          pip install (Get-ChildItem wheels/*.whl).FullName
          python -c "import pycolmap; print(pycolmap.__version__, pycolmap.Reconstruction().summary())"
      - name: Keep the packages vcpkg built
        if: always()
        uses: actions/cache/save@v4
        with:
          path: vcpkg-cache
          key: vcpkg-arm64-windows-colmap-4.2.1-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: win-arm64-pycolmap
          path: wheels/*.whl
          if-no-files-found: error
