# Download and visit statistics for the page "Downloads and visits" of the documentation site (docs/stats.md).
#
# Every Monday, and on demand (gh workflow run stats.yml), .github/scripts/download_stats.py takes stats.json
# from the orphan branch "stats", adds the new numbers of every source and writes it back through the GitHub
# API: commits by Enzo Cocca on that branch only, never on main. Then the docs workflow builds the site again
# and its hook (tools/stats_hook.py) puts the numbers on the page.
#
# Every source is optional: without its secret it is left out and the page says "not configured yet". The
# downloads of the application (GitHub releases) need nothing. Setup, once:
#
#   1. GoatCounter (visits of the site, download clicks; free for non-commercial projects): sign up at
#      https://www.goatcounter.com/signup with the site code pyarchinit-photogrammetry.
#   2. Then, and only then, uncomment extra.goatcounter in mkdocs.yml: the site starts loading the counting
#      script and the download buttons count their clicks. Before the code is registered, anyone could take
#      it and receive the visits of the site.
#   3. GoatCounter API token: on https://pyarchinit-photogrammetry.goatcounter.com, your name in the top menu
#      > API > a new token with the permission "Read statistics".
#   4. Your own visits left out: open https://enzococca.github.io/pyarchinit-photogrammetry/#toggle-goatcounter
#      once in every browser you use (the same link counts that browser again).
#   5. pip installs from BigQuery: a Google Cloud project in the BigQuery sandbox (no billing account,
#      https://console.cloud.google.com/bigquery), in it a service account with the role "BigQuery Job User"
#      and a JSON key of that account. A sandbox has no billing, so it can never be charged: past the free
#      1 TB a month its queries fail until the next month. The script reads one day per query and stops by
#      itself at 800 GB billed in a month, or for the rest of the month when one day bills more than 100 GB.
#      Without BigQuery the page shows the raw numbers of pypistats.org.
#   6. Visits of the repository: a fine-grained personal access token (https://github.com/settings/tokens),
#      repository access "Only select repositories" > this one, permission "Administration: Read-only".
#   7. The secrets, in Settings > Secrets and variables > Actions > New repository secret:
#      GOATCOUNTER_TOKEN (3), GCP_PROJECT (the id of the project of 5), GCP_SA_KEY (the whole JSON key of 5),
#      STATS_TOKEN (6).
#   8. A first run: gh workflow run stats.yml (Actions > stats > Run workflow).
name: stats

on:
  schedule:
    - cron: "30 5 * * 1"  # Monday 05:30 UTC
  workflow_dispatch:

permissions:
  contents: write  # the branch stats
  actions: write  # starts the docs workflow

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-24.04
    env:
      HAS_BIGQUERY: ${{ secrets.GCP_PROJECT != '' && secrets.GCP_SA_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: BigQuery client (only with the secrets GCP_PROJECT and GCP_SA_KEY)
        if: env.HAS_BIGQUERY == 'true'
        run: python -m pip install "google-cloud-bigquery>=3.20,<4"
      - name: Statistics kept on the branch stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/download_stats.py get "$RUNNER_TEMP/stats.json"
      - name: New numbers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python .github/scripts/download_stats.py update "$RUNNER_TEMP/stats.json"
      - name: Back on the branch stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/download_stats.py put "$RUNNER_TEMP/stats.json"
      - name: Site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml -R "$GITHUB_REPOSITORY"
