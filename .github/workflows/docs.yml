name: docs

# The documentation site (MkDocs Material, English and Italian) on GitHub Pages:
# https://enzococca.github.io/pyarchinit-photogrammetry/
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "overrides/**", "tools/stats_hook.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: MkDocs
        run: python -m pip install "mkdocs-material==9.7.7" "mkdocs-static-i18n==1.3.1"
      - name: Statistics of the page "Downloads and visits" (the branch stats, when it exists)
        # written every week by the stats workflow; tools/stats_hook.py reads build/stats.json
        run: |
          found=0; git ls-remote --exit-code --heads origin stats > /dev/null || found=$?
          if [ "$found" = 0 ]; then
            git fetch --depth=1 origin stats
            mkdir -p build && git show FETCH_HEAD:stats.json > build/stats.json
          elif [ "$found" = 2 ]; then
            echo "no branch stats yet: the page says the numbers come with the weekly workflow"
          else
            echo "::error::the branch stats cannot be read"; exit 1
          fi
      - name: Site
        run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
