name: rust

# The Rust of the program on its own, without Python (folder native/): the crate of the kernels (ppg_engine) and
# the small binary that lists the GPU adapters and times the matching kernel (ppg_bench, the command ppg-bench).
#   test          `cargo test` of the two crates on Linux, macOS and Windows;
#   deny          the licences and the sources of the crates of the workspace, against native/deny.toml;
#   software-gpu  a check: the GPU kernels on the software rasterisers of the runners, which have no GPU
#                 (lavapipe on Linux, WARP on Windows), required on both. The program never takes such an
#                 adapter by itself, so the job names it: `ppg-bench match --device N --n 1024` with the tiles the
#                 adapter's workgroup memory takes and again with `--workgroup-kb 16`, the small tiles (the
#                 matcher must give the same matches with either, and the same as its CPU twin; 1024 descriptors
#                 because WARP takes minutes for the 4096 of the default, the bit-for-bit comparison at full size
#                 being the Rust test `matching` of the job `test`), and
#                 PPG_TEST_SOFTWARE_GPU=1 for the tests of the kernels in tests/test_native.py. One of them is
#                 left out, the fusion compared with COLMAP's; the others run, SIFT included: a kernel that
#                 fails on one of the rasterisers fails the check and is reported, never hidden by a filter.
#                 The timeout is an estimate for a software rasteriser.
on:
  push:
    paths: ["native/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["native/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Tests of ppg_engine and ppg_bench
        # never the whole workspace: its root package, ppg_core, is an extension module of Python and does not
        # link as a test
        working-directory: native
        run: cargo test --locked -p ppg_engine -p ppg_bench

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Licences and sources of the crates (native/deny.toml)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml
          command: check licenses sources
      - name: Advisories (shown, never a failure of the job - they change without a commit)
        uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: true
        with:
          manifest-path: native/Cargo.toml
          command: check advisories

  software-gpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30   # an estimate for a software rasteriser, to be corrected after the first run
    env:
      PPG_TEST_SOFTWARE_GPU: "1"   # the GPU tests take the first software adapter (fixture gpu_test_device)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries (those of the tests workflow, and lavapipe with Mesa's Vulkan drivers)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libegl1 libgl1 libgomp1 \
            libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 locales gdb
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Native core (Rust)
        run: pip install ./native
      - name: Adapters (without one of type Cpu, a software rasteriser, the job ends here with an error)
        shell: bash
        working-directory: native
        run: |
          adapters="$(cargo run --release -p ppg_bench -- adapters)"
          printf '%s\n' "$adapters"
          { echo "ppg-bench adapters"; echo '```'; printf '%s\n' "$adapters"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # the indices of the adapters of type Cpu; Python on Windows ends its line with CR LF and bash keeps
          # the CR
          cpu="import json, sys; print(*(a['index'] for a in json.load(sys.stdin) if a['device_type'] == 'Cpu'))"
          software="$(python -c "$cpu" <<< "$adapters" | tr -d '\r')"
          if [ -z "$software" ]; then
            # a runner whose software rasteriser is not there would otherwise be a green job that tried nothing
            echo "::error::no adapter of type Cpu (lavapipe, WARP) on this runner: the kernels were not tried"
            exit 1
          fi
          echo "SOFTWARE_ADAPTERS=$software" >> "$GITHUB_ENV"
      - name: Matching kernel on each software adapter (ppg-bench match --device N --n 1024, both tile sizes)
        id: matching
        shell: bash
        working-directory: native
        run: |
          # match without --device leaves the software adapters out (it answers "skipped" where there is no
          # GPU), so each is named: once with the tiles its workgroup memory takes, once with the small tiles
          # (--workgroup-kb 16). 1024 descriptors a set, not the 4096 of the default: WARP needs about 3.5
          # minutes for 4096 x 4096 (one run of the first version of this step), 1024 x 1024 is a sixteenth of
          # that and still spans several tiles of both sets with either tile size. A run that fails does not
          # stop the next: the step fails at the end
          failed=0
          for device in $SOFTWARE_ADAPTERS; do
            for options in "" "--workgroup-kb 16"; do
              status=0
              answer="$(cargo run --release -p ppg_bench -- match --device "$device" --n 1024 $options 2>&1)" \
                || status=$?
              printf '%s\n' "$answer"
              {
                echo "ppg-bench match --device $device --n 1024 $options (exit code $status)"
                echo '```'; printf '%s\n' "$answer" | tail -20; echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "$status" -ne 0 ]; then
                echo "::error::ppg-bench match --device $device --n 1024 $options ended with exit code $status"
                failed=1
              fi
            done
          done
          exit $failed
      - name: Kernel tests on the first software adapter
        # also after a matching that failed: the other kernels are still to be tried
        if: ${{ success() || steps.matching.outcome == 'failure' }}
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PPG_RENDERER: software
        run: |
          set +e
          export GLOG_minloglevel=2
          # the tests of the GPU kernels in tests/test_native.py, all but one: test_gpu_fusion_agrees_with_colmaps
          # needs COLMAP's fusion beside the kernel and is far too slow on a software rasteriser. The others,
          # test_gpu_sift_finds_colmaps_points included, are part of the check: one that fails on a rasteriser
          # fails the job. --durations=0 prints the time of each test (setup, call, teardown)
          python -m pytest tests/test_native.py -k "gpu and not fusion_agrees_with_colmaps" -q -rs --durations=0 \
            2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # pytest's summary counts what ran ("3 passed, 2 skipped in 12.3s"): a green pytest that passed nothing -
          # every selected test skipped, or none selected - tried no kernel and must not read as a trial that went well
          count='[0-9]+ (passed|failed|skipped|errors?|deselected|xfailed|xpassed|warnings?)'
          summary="$(grep -E "^(=+ )?(($count(, )?)+ in [0-9.]+s|no tests ran)" pytest.log | tail -1)"
          passed="$(printf '%s\n' "$summary" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+')"
          if [ "$status" -eq 0 ] && [ "${passed:-0}" -eq 0 ]; then
            echo "::error::no kernel test passed on the software adapter" \
              "(${summary:-no summary in pytest.log}): every selected test was skipped"
            status=1
          fi
          {
            echo 'pytest tests/test_native.py -k "gpu and not fusion_agrees_with_colmaps"'
            echo '```'; tail -60 pytest.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
