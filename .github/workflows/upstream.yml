name: upstream

# The newest versions of the libraries the engine is built on - pycolmap (COLMAP) and Open3D - tried every week before
# pip users get them: the program takes them up to the versions it was tested with (pyproject.toml), and this run
# installs the newest one of each on PyPI beyond those (pre-releases included; the versions the program excludes with
# "!=" left out), compares their public API with the installed ones, and runs the tests with them, the failed ones a
# second time. The summary of the run says what they remove that the program uses, what they add (a GPU back-end
# among it), and what to do: raise the ceiling, adapt the program first, or exclude a version pip users already get
# (.github/scripts/upstream_check.py). A week with nothing newer ends at the plan. A failing run is red: GitHub writes
# to whoever last changed the schedule.
on:
  schedule:
    - cron: "17 4 * * 1"  # Mondays, 04:17 UTC
  workflow_dispatch:
    inputs:
      pycolmap:
        description: "A version of pycolmap to try (empty: the newest beyond the installed one)"
        type: string
        default: ""
      open3d:
        description: "A version of Open3D to try (empty: the newest beyond the installed one)"
        type: string
        default: ""
      prereleases:
        description: "Pre-releases count as the newest"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: System libraries (as in the tests workflow)
        run: >
          sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libegl1 libgl1 libgomp1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 locales
      - name: Italian locale (a decimal comma, which tests/test_native.py runs RTKLIB's numbers under)
        run: sudo locale-gen it_IT.UTF-8
      - name: The program with the versions it asks for, and the native core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
          pip install ./native
      - name: The newest versions to try
        id: plan
        env:
          ASKED_PYCOLMAP: ${{ inputs.pycolmap }}
          ASKED_OPEN3D: ${{ inputs.open3d }}
          PRERELEASES: ${{ github.event_name == 'schedule' || inputs.prereleases }}
        run: |
          extra=()
          [ "$PRERELEASES" = "true" ] || extra+=(--no-prereleases)
          python .github/scripts/upstream_check.py plan --track pycolmap --track open3d \
            --asked "pycolmap=$ASKED_PYCOLMAP" --asked "open3d=$ASKED_OPEN3D" "${extra[@]}" --out plan.json
      - name: Their public API against the installed one
        if: steps.plan.outputs.install != ''
        env:
          INSTALL: ${{ steps.plan.outputs.install }}
        run: |
          python .github/scripts/upstream_check.py api --plan plan.json --out api-before.json
          pip install $INSTALL
          python .github/scripts/upstream_check.py api --plan plan.json --out api-after.json
      - name: The tests with them (the failed ones a second time)
        if: steps.plan.outputs.install != ''
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PPG_RENDERER: software
          GLOG_minloglevel: "2"
        run: |
          set +e
          python -m pytest -q --tb=line -rfE --capture=sys -o faulthandler_timeout=1200 \
            -o faulthandler_exit_on_timeout=true 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          rerun=()
          if [ "$status" -ne 0 ]; then
            mapfile -t failed < <(python .github/scripts/upstream_check.py failures pytest.log)
            if [ "${#failed[@]}" -gt 0 ]; then
              python -m pytest -q --tb=short -rfE --capture=sys -o faulthandler_timeout=1200 \
                -o faulthandler_exit_on_timeout=true "${failed[@]}" 2>&1 | tee pytest-rerun.log
              rerun=(--rerun-log pytest-rerun.log --rerun-status "${PIPESTATUS[0]}")
            fi
          fi
          python .github/scripts/upstream_check.py tests --status "$status" --log pytest.log "${rerun[@]}" \
            --out tests.json
      - name: Summary
        if: always()
        shell: bash
        run: |
          set +e
          if [ ! -f plan.json ]; then
            echo "The plan was not made: see the step above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          args=(--plan plan.json --src src)
          for f in before after; do
            if [ -f "api-$f.json" ]; then args+=(--"$f" "api-$f.json"); fi
          done
          if [ -f tests.json ]; then args+=(--tests tests.json); fi
          python .github/scripts/upstream_check.py report "${args[@]}" > summary.md
          status=$?
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
          exit $status
