name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (SpatiaLite for PyArchInit, EGL/GL for Open3D, Qt offscreen for the GUI tests)
        run: >
          sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libegl1 libgl1 libgomp1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0 locales gdb
      - name: Italian locale (a decimal comma, which tests/test_native.py runs RTKLIB's numbers under)
        run: |
          sudo locale-gen it_IT.UTF-8
          locale -a | grep -i '^it_IT'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Native core (Rust; Python 3.11 keeps the numpy code, so both are tested)
        if: matrix.python-version == '3.12'
        run: pip install ./native
      - name: RustGIS engine (rustgis-cli 0.4.0 for Linux, checked against the SHA256SUMS of the release)
        # the tests of the live link with RustGIS (tests/test_rustgis_link.py) run against the real engine, rustgis-cli,
        # where PPG_RUSTGIS_CLI names it; without it they skip. One job has it: Python 3.12, as for the native core.
        if: matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cli="$(.github/scripts/get_rustgis_cli.sh v0.4.0 "$RUNNER_TEMP/rustgis")"
          ls -l "$cli"
          echo "PPG_RUSTGIS_CLI=$cli" >> "$GITHUB_ENV"
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PPG_RENDERER: software
        run: |
          set +e
          # a native crash must leave its stacks in the log: pytest captures sys.stdout/err only (with the
          # descriptors captured, the dump went into pytest's temporary file and was lost with the
          # process), and its faulthandler starts after tests/conftest.py has imported pycolmap, so it
          # prints the Python stack of every thread (the test, the line) and then passes the signal to
          # glog's handler, which prints the native stack (started earlier with -X faulthandler, it was
          # replaced by glog's handler: the native stack alone, no test). A test still running after
          # 20 minutes dumps the stacks of every thread and ends the run instead of hanging the job.
          export GLOG_minloglevel=2
          # a test blocked in native code (Qt deleting a window, a thread that never ends) shows no Python
          # frame in that dump: after 15 minutes without a line of output the native stacks of every
          # thread are printed once with gdb, five minutes before the dump of faulthandler ends the run
          : > pytest.log
          (
            n=0
            while sleep 60; do
              n=$((n + 1))
              # memory of the runner and of pytest every five minutes: a runner that "lost communication"
              # may have been starved, and the last line seen in the live log tells
              if [ $((n % 5)) -eq 0 ]; then
                echo "[mem] $(free -m | awk '/^Mem:/ {print "used " $3 " MB, available " $7 " MB"} /^Swap:/ {print "swap " $3 " MB"}' | paste -sd, -), pytest rss $(ps -o rss= -C python | sort -n | tail -1 | awk '{print int($1 / 1024)}') MB, load $(cut -d' ' -f1 /proc/loadavg)"
              fi
              age=$(( $(date +%s) - $(stat -c %Y pytest.log) ))
              if [ "$age" -gt 900 ]; then
                pid=$(pgrep -f "python -m pytest" | head -1)
                echo "::group::Native stacks of pytest ($pid), silent for ${age}s"
                [ -n "$pid" ] && sudo gdb -p "$pid" -batch -ex "thread apply all bt 60" 2>&1 | grep -v "^\[New LWP\|^warning:" | tail -600
                echo "::endgroup::"
                break
              fi
            done
          ) &
          watchdog=$!
          python -m pytest -q --tb=line -rfE --capture=sys -o faulthandler_timeout=1200 \
            -o faulthandler_exit_on_timeout=true 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          kill "$watchdog" 2>/dev/null
          # failures as annotations, readable on the run page
          grep -E "^(FAILED|ERROR) |^/.*:[0-9]+: " pytest.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          { echo '```'; tail -60 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  windows:
    # the suite on Windows x64: there a file cannot be replaced, moved or deleted while the program
    # holds it open or memory-mapped (POSIX allows it), paths have backslashes and there is no
    # /bin/sh. No SpatiaLite in the runner image: the tests of PyArchInit databases skip themselves.
    runs-on: windows-latest
    timeout-minutes: 180   # about 45 minutes on a quiet day; slow runners took more than 2 hours (2026-11-05)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Native core (Rust, as in the Windows application)
        run: pip install ./native
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PPG_RENDERER: software
        run: |
          set +e
          export GLOG_minloglevel=2
          python -m pytest -q --tb=short -rfEs --capture=sys -o faulthandler_timeout=1200 \
            -o faulthandler_exit_on_timeout=true 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) " pytest.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          { echo '```'; tail -60 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
