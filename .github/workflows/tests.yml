name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: System libraries (SpatiaLite for PyArchInit, EGL/GL for Open3D, Qt offscreen for the GUI tests)
        run: >
          sudo apt-get update && sudo apt-get install -y libsqlite3-mod-spatialite libegl1 libgl1 libgomp1
          libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Native core (Rust; Python 3.11 keeps the numpy code, so both are tested)
        if: matrix.python-version == '3.12'
        run: pip install ./native
      - name: Tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PPG_RENDERER: software
        run: |
          set +e
          # a native crash (exit 139, seen on 3.12 with the native core) must leave its traceback in the log:
          # Python's faulthandler from the start, and pytest capturing sys.stdout/err only (with the
          # descriptors captured, the dump went into pytest's temporary file and was lost with the process)
          export GLOG_minloglevel=2
          python -X faulthandler -m pytest -q --tb=line -rfE --capture=sys -p no:faulthandler 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # failures as annotations, readable on the run page
          grep -E "^(FAILED|ERROR) |^/.*:[0-9]+: " pytest.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          { echo '```'; tail -60 pytest.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
