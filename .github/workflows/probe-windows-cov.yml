name: probe-windows-cov
# TEMPORARY (branch windows-covariance): the covariance of the nadir grid on Windows
on:
  push:
    branches: [windows-covariance]
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Native core
        run: pip install ./native
      - name: Probe
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PPG_RENDERER: software
        run: |
          export GLOG_minloglevel=2
          python -c "import numpy; numpy.show_config()" 2>&1 | head -40
          python -m pytest -q -s -rfEs tests/test_probe_windows_covariance.py tests/test_optimize_undetermined.py -k "probe or places_weighs or walk or lens or no_covariance or singular_with_it_free or another_reason or among_several" 2>&1 | grep -v "^INFO" | tail -150
