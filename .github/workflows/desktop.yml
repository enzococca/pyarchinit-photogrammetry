name: desktop

# Builds the packaged desktop application (PyInstaller) for macOS (15+, Apple Silicon), Windows x64
# and Windows ARM64 (with the wheels the windows-arm workflow built: lazrs, OpenCV, pycolmap, Open3D,
# VTK, pye57).
# Runs on demand, on version tags and when a release is published; the archives are
# uploaded as workflow artifacts and attached to the release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write   # attach the archives to the release

jobs:
  build:
    # releases of versions only (vX.Y.Z): not those holding data, such as the photos of the tutorials
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # rasterio wheels need macOS 15+
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,build]"
          pip install ./native
      - name: Build and smoke-test
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PyArchInit-Photogrammetry-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        # macOS on CI has no Developer ID / Apple notary credentials. Keep that build as
        # a workflow artifact; packaging/mac_release.sh uploads the signed, notarized DMG.
        if: github.event_name == 'release' && runner.os != 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          tag="${{ github.event.release.tag_name }}"
          files=(dist/*.dmg dist/*.zip)   # macOS builds a dmg, Windows a zip
          mkdir -p dist/plain   # a copy without the version: the fixed link of the installation page
          for f in "${files[@]}"; do cp "$f" "dist/plain/$(basename "${f/-${tag#v}-/-}")"; done
          gh release upload "$tag" "${files[@]}" dist/plain/* --clobber

  build-arm64:
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: windows-11-arm
    timeout-minutes: 180
    env:
      # runs of the windows-arm workflow holding the win-arm64 wheels (artifacts last 90 days: run
      # that workflow again and update these when they expire)
      WHEEL_RUNS: "39275909789 39979737728 39296584761 39405291562 40083058295 40076719405"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: arm64
      - name: The wheels built by the windows-arm workflow
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($run in $env:WHEEL_RUNS.Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)) {
            $ok = $false
            foreach ($try in 1..5) {  # the artifact service answers HTTP 500 now and then
              gh run download $run --pattern "win-arm64-*" -D wheels
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds 30
            }
            if (-not $ok) { throw "the artifacts of run $run could not be downloaded" }
          }
          Remove-Item -Recurse -Force wheels/win-arm64-core -ErrorAction SilentlyContinue  # built below from native/
          python -m pip install --upgrade pip maturin numpy
          if ($LASTEXITCODE -ne 0) { throw "pip" }
          pip install (Get-ChildItem wheels -Recurse -Filter *.whl | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { throw "the wheels did not install" }
      - name: Install
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # everything as on x64 (VTK and pye57 from the windows-arm wheels), PostGIS through psycopg 3
          pip install -e ".[gui,scans,mesh,bim,learn,munsell,postgis,build]"
          # the native core of this commit (the runner image has Rust, as in the windows-arm workflow)
          maturin build --release -m native/Cargo.toml --out core_wheels
          pip install (Get-ChildItem core_wheels/*.whl).FullName
          python -c "import open3d, pycolmap, cv2, lazrs, ppg_core, PySide6, pye57, pyvistaqt, pyarchinit_photogrammetry as ppg; from vtkmodules.vtkCommonCore import vtkVersion; print(ppg.__version__, open3d.__version__, pycolmap.__version__, cv2.__version__, ppg_core.__version__, vtkVersion.GetVTKVersion())"
          # RTKLIB inside the core this app ships: a PPK on RTKLIB's test data (.github/scripts/ppk_smoke.py)
          python .github/scripts/ppk_smoke.py
      - name: libpq for psycopg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $root = $PWD.Path -replace '\\', '/'
          git clone --depth 1 https://github.com/microsoft/vcpkg "$root/vcpkg"
          & "$root/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$root/vcpkg/vcpkg.exe" install libpq --triplet arm64-windows
          "PPG_EXTRA_BINARIES=$root/vcpkg/installed/arm64-windows/bin" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build and smoke-test
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PyArchInit-Photogrammetry-windows-arm64
          path: dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          mkdir -p dist/plain   # a copy without the version: the fixed link of the installation page
          for f in dist/*.zip; do cp "$f" "dist/plain/$(basename "${f/-${tag#v}-/-}")"; done
          gh release upload "$tag" dist/*.zip dist/plain/* --clobber

