name: desktop

# Builds the packaged desktop application (PyInstaller) for macOS (15+, Apple Silicon) and Windows.
# Runs on demand, on version tags and when a release is published; the archives are
# uploaded as workflow artifacts and attached to the release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write   # attach the archives to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15   # rasterio wheels need macOS 15+
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,build]"
      - name: Build and smoke-test
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: PyArchInit-Photogrammetry-${{ matrix.label }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip)   # macOS builds a dmg, Windows a zip
          gh release upload "${{ github.event.release.tag_name }}" "${files[@]}" --clobber
