name: publish

# Publishes to PyPI when a GitHub Release is published (or when run by hand).
# Uses PyPI trusted publishing: no token is stored in the repository.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    # releases of versions only (vX.Y.Z): not those holding data, such as the photos of the tutorials
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check dist/*
          # data files read at run time must be inside the wheel
          for f in pyarchinit/pyarchinit5_schema.sql gui/resources/logo.svg; do
            python -m zipfile -l dist/*.whl | grep -q "pyarchinit_photogrammetry/$f" || { echo "missing $f in the wheel"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
