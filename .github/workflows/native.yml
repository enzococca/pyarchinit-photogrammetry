name: native

# Wheels of the native core (pyarchinit-photogrammetry-core, folder native/): one abi3 wheel per
# platform for Python 3.10 and later. Built on demand and on tags core-v*, which also publish
# them to PyPI with trusted publishing (the PyPI project needs a trusted publisher for this
# workflow and the environment pypi-core; no token is stored in the repository).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        type: boolean
        default: false
  push:
    tags: ["core-v*"]

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-darwin, label: macos-arm64, test: true }
          - { os: macos-15, target: x86_64-apple-darwin, label: macos-x64, test: false }
          - { os: windows-latest, target: x64, label: windows-x64, test: true }
          - { os: ubuntu-24.04, target: x86_64, label: linux-x64, test: true }
          - { os: ubuntu-24.04, target: aarch64, label: linux-arm64, test: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: Smoke test
        if: matrix.test
        shell: bash
        run: |
          pip install numpy native/dist/*.whl
          python -c "import numpy as np, ppg_core; print(ppg_core.__version__, ppg_core.combine_depths(np.ones((2, 3, 4), np.float32), 1, 0.01).shape)"
          # RTKLIB inside the core: RTKLIB's test station 3040 against 0759, standing still (every epoch fixed,
          # the station where its RINEX header puts it) and moving (a tenth fixed at least, the median of
          # those on the static station); the script is shared with the windows-arm workflow
          python .github/scripts/ppk_smoke.py
          # the Hatanaka decoder: the Compact RINEX files of tests/data/crinex as CRX2RNX decoded them, a cut one
          # refused (every archive of the permanent stations is Compact RINEX)
          python .github/scripts/crinex_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.label }}
          path: native/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          command: sdist
          args: --out dist
      - name: The sdist holds no IAU SOFA code
        # RTKLIB's sofa.c (routines of the IAU SOFA library, whose licence this package does not carry) is
        # not vendored and not built: native/vendor/rtklib/VERSION says why. Looked for by name and by
        # the copyright line of the SOFA routines in any C source.
        run: |
          python3 - <<'EOF'
          import glob, re, sys, tarfile
          [path] = glob.glob("native/dist/*.tar.gz")
          found = []
          with tarfile.open(path) as sdist:
              for member in sdist:
                  if re.search(r"(^|/)sofa[^/]*$", member.name, re.IGNORECASE):
                      found.append(member.name)
                  elif member.isfile() and member.name.endswith((".c", ".h")):
                      if b"IAU SOFA Board" in sdist.extractfile(member).read():
                          found.append(member.name)
          print(path, "has IAU SOFA code: " + ", ".join(found) if found else "has no IAU SOFA code")
          if found:
              print("::error::the sdist holds IAU SOFA code (" + ", ".join(found) + "): its licence is not carried by this package")
              sys.exit(1)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: native/dist/*.tar.gz
          if-no-files-found: error

  pypi:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/core-v') || inputs.publish
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
